name: Check PS5 game prices

on:
  schedule:
    # every 6 hours — adjust as you like (cron is in UTC)
    - cron: "0 */6 * * *"
  workflow_dispatch: {}
  push:
    paths:
      - "docs/games.json"

permissions:
  contents: write

jobs:
  check-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run price check
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: python scripts/check_prices.py

      - name: Commit updated price data
        run: |
          git config user.name "ps5-price-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/state.json docs/data/notifications.json
          git diff --cached --quiet || git commit -m "Update prices [skip ci]"
          git push
